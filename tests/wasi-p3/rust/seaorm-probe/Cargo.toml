[package]
name = "seaorm-probe"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["native"]
native = ["sea-orm/runtime-tokio", "dep:tokio"]

[dependencies]
anyhow = "1"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-postgres"] }
tokio = { version = "1", optional = true, features = ["macros", "rt", "time", "net"] }

[[bin]]
name = "seaorm-probe"
path = "src/main.rs"
required-features = ["native"]
