[package]
name = "p3-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde_json = "1"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-postgres"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "tls-rustls-ring-webpki"] }
sqlx-probe = { path = "../sqlx-probe", default-features = false }
seaorm-probe = { path = "../seaorm-probe", default-features = false }
http = "1"
bytes = "1"
http-body-util = "0.1"
wasip3 = { version = "=0.9.0", features = ["http-compat"] }
wit-bindgen = { version = "=0.62.0", features = ["async-spawn", "inter-task-wakeup"] }

[target.'cfg(target_os = "wasi")'.dependencies]
sqlx-core = { version = "=0.9.0", features = ["_rt-wasi-p3"] }
