[package]
name = "sqlx-probe"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["native"]
native = ["sqlx/runtime-tokio", "dep:tokio"]

[dependencies]
anyhow = "1"
futures-util = "0.3"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "derive"] }
tokio = { version = "1", optional = true, features = ["macros", "rt", "time", "net"] }

[[bin]]
name = "sqlx-probe"
path = "src/main.rs"
required-features = ["native"]
